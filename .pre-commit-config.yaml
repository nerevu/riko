repos:
  # Pre-commit installs the locked ruff and rumdl in their own environments, so the
  # hooks match `manage lint` and CI from any Git client. `manage upgrade` rewrites the
  # pins and `manage lint --deps` fails when one drifts from uv.lock.
  - repo: local
    hooks:
      - id: ruff-check-imports
        name: ruff (sort imports)
        entry: ruff check --select I --fix --show-fixes --config pyproject.toml
        language: python
        additional_dependencies: [ruff==0.16.10]
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff (check)
        entry: ruff check --fix --show-fixes --config pyproject.toml
        language: python
        additional_dependencies: [ruff==0.16.10]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff (format)
        entry: ruff format --config pyproject.toml
        language: python
        additional_dependencies: [ruff==0.16.10]
        types_or: [python, pyi]
      - id: rumdl-check
        name: rumdl (check)
        entry: rumdl check --fix
        language: python
        additional_dependencies: [rumdl==0.3.2]
        types: [markdown]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
