repos:
  # The locked ruff (see `manage upgrade`), so hooks match `manage lint` and CI.
  - repo: local
    hooks:
      - id: ruff-check-imports
        name: ruff (sort imports)
        entry: uv run --active --no-sync ruff check --select I --fix --config pyproject.toml
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff (check)
        entry: uv run --active --no-sync ruff check --fix --config pyproject.toml
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff (format)
        entry: uv run --active --no-sync ruff format --config pyproject.toml
        language: system
        types_or: [python, pyi]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
