[project]
version = "0.77.3"
name = "riko"
authors = [
    {name = "Reuben Cummings", email = "reubano@gmail.com"}
]
maintainers = [
    {name = "Reuben Cummings", email = "reubano@gmail.com"}
]
description = "A stream processing engine modeled after Yahoo! Pipes."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE*"]
classifiers=[
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "babel>=2.8.0,<3.0.0",
    "click>=8.4.0",
    "feedparser>=5.2.1,<7.0.0",
    "html5lib>=1.0.1,<2.0.0",
    "jinja2>=3.1.6",
    "meza>=0.42.5",
    "mezmorize>=0.27.0",
    "networkx>=3.4.2",
    "pygogo>=0.12.0,<2.0.0",
    "python-dateutil>=2.8.1,<3.0.0",
    "python-slugify>=1.2.5",
    "pytz>=2019.3",
    "requests>=2.22.0,<3.0.0",
    "typing-extensions>=4.13.0",
]

[project.optional-dependencies]
perf = [
    "fastfeedparser>=0.6.0",
    "ijson>=3.4.0,<4.0.0",
    "lxml>=4.5.0,<7.0.0",
]

async = [
    "anyio>=4.0.0",
    "asyncer>=0.0.18",
    "httpx>=0.27.0",
]

finance = [
    "csv2ofx>=0.34.2",
]

[dependency-groups]
test = [
    "coverage>=4.3.4,<8.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

lint = [
    "deptry>=0.25.1",
    "docutils>=0.21",
    "pygments>=2.20.0",
    "pylint>=4.0.5,<5.0.0",
    "pyright>=1.1.414",
    "ruff>=0.16.10,<0.17.0",
    "types-lxml>=2026.2.16",
    "types-networkx>=3.4.2",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "ipython>=8.39.0",
    "pre-commit>=4.6.1",
    "twine>=6.0.0",
]

[project.scripts]
manage = "riko.cli.manage:manager"
run-pipe = "riko.cli.runpipe:run"
benchmark = "riko.cli.benchmark:main"
compile-workflow = "riko.cli.compile:run"
build-workflow = "riko.cli.build_workflow:run"
gen-config = "riko.cli._gen_config:main"
gen-names = "riko.cli._gen_names:main"
gen-api-surface = "riko.cli._gen_api_surface:main"

[tool.uv]
# Resolve only releases at least a week old, so a broken or hijacked release never
# reaches the lock. `exclude-newer-package` admits an urgent one early.
exclude-newer = "1 week"

# Rebuild the local `riko` install when any source file changes, not just when
# pyproject.toml/setup.py change (uv's default). Without this, edits under
# `riko/` (e.g. new CLI options) don't invalidate the cached build, so
# `uv sync`/tox/CI keep reusing a stale wheel of the unchanged version.
cache-keys = [{ file = "pyproject.toml" }, { file = "riko/**/*.py" }]

[tool.uv.audit]
malware-check = true

[tool.ruff]
extend-exclude = [
    "**/pycache",
    ".cache",
    ".claude",
    ".ruff_cache",
    ".tox/*",
    "tmp",
    "build/*",
    "dist/*",
]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
future-annotations = true

extend-select = [
    "E",    # pycodestyle errors
    "E302", # pycodestyle: Two blank lines before top-level defs
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "I",    # isort
    "B",    # flake8-bugbear: opinionated warnings
    "Q",    # flake8-quotes: enforce consistent quote style)
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "D",    # pydocstyle
    "S",    # flake8-bandit
    "TC",   # flake8-typing-imports
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "PLC0415", # Import not at top of file
    "ERA",  # eradicate: commented-out code (tests only; see per-file ignores)
]

ignore = [
    # docs
    "D101",  # undocumented-public-class
    "D102",  # undocumented-public-method
    "D103",  # undocumented-public-function
    "D105",  # undocumented-magic-method
    "D107",  # undocumented-public-init
    "D401",  # non-imperative-mood
    "D417",  # undocumented-param

    # misc
    "T201",  # print
    "T203",  # p-print

    # stylistic
    "D301",  # escape-sequence-in-docstring
    "D412",  # blank-lines-between-header-and-content
    "E731",  # do not assign a lambda expression, use a def

    # security
    "S404",
    "S602",
    "S603",

     # this is incompatible with D211 no-blank-line-before-class
    "D203",  # incorrect-blank-line-before-class

     # this is incompatible with D213 multi-line-summary-second-line
    "D212",  # multi-line-summary-first-line
]

preview = true

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.isort]
known-first-party = ["riko"]
split-on-trailing-comma = false

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = [
    "S101",   # Use of `assert` detected
    "S102",   # Use of `exec` detected
]

"riko/**/*" = [
    "ERA001",  # Commented-out code (enforced in tests only)
]

".claude/**/test_*.py" = [
    "S101",   # Use of `assert` detected
]

"tests/pyworkflows/*" = [
    "ERA001",  # Commented-out code (generated fixture data)
    "E501",  # Line too long (generated fixture data)
    "N999",  # Invalid module name
    "N802",  # Function name
    "N806",  # Variable in function should be lowercase (generated _OUTPUT)
    "UP009",  # UTF-8 encoding declaration (generated header)
]

"examples/pyworkflows/*" = [
    "N999",  # Invalid module name
    "N802",  # Function name
    "N806",  # Variable in function should be lowercase (generated _OUTPUT)
    "UP009",  # UTF-8 encoding declaration (generated header)
]

[tool.deptry]
# `manage lint --deps` runs deptry from the repository root. The root conftest.py
# is pytest configuration (like the default-excluded tests/), and .claude/ holds
# agent tooling rather than project code.
extend_exclude = ["conftest\\.py", "\\.claude"]

[tool.deptry.package_module_name_map]
# The tox lint env installs only the lint group, so deptry can't read these
# distributions' import names from installed metadata.
python-dateutil = "dateutil"
python-slugify = "slugify"

[tool.deptry.per_rule_ignores]
# `manage lint --rst` imports docutils in a try/except ImportError block; it is
# declared in the lint group because only the lint tooling needs it.
DEP004 = ["docutils"]

[tool.pyright]
venv = "riko"
pythonPlatform = "Linux"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"
exclude = [
    "**/pycache",
    ".cache",
    ".claude",
    ".ruff_cache",
    ".tox/*",
    ".venv",
    "tmp",
    "build/*",
    "dist/*",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "--doctest-glob=*.rst", "--cov=riko", "--tb=short"]
testpaths = ["tests", "riko", "examples", "README.rst", "docs"]
doctest_optionflags = ["ELLIPSIS"]
timeout = 30
timeout_method = "thread"
faulthandler_timeout = 15
markers = [
    "anyio: requires the async optional dependencies (anyio + httpx)",
    "smoke: fast install-validation subset run against the built wheel/sdist",
    "perf: requires the perf extra (lxml/ijson/fastfeedparser); auto-skips if missing",
    "finance: requires the finance extra (csv2ofx); auto-skips if missing",
    "slow: slow test (thread/process pools, parallelism); exclude with -m 'not slow'",
    "simulated_network: exercises HTTP against a loopback server (no real internet)",
]
filterwarnings = [
    # hard-fail on real bugs
    "error::ResourceWarning",
    "error::RuntimeWarning",
    "error::DeprecationWarning:riko",
    "error::PendingDeprecationWarning:riko",
    "error::pytest.PytestUnraisableExceptionWarning",

    # everything else stays visible but non-fatal
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
]

[tool.coverage.run]
# Python 3.12's sys.monitoring tracer: line coverage at a fraction of the default cost.
core = "sysmon"
# Console scripts run as subprocesses in the functional tests; measure them there.
patch = ["subprocess"]
# Dev-only `manage` tooling is not shipped behavior, so it does not count toward the
# uncovered-line ceiling. The console scripts and their `_document` front door do.
omit = [
    "*/riko/cli/manage.py",
    "*/riko/cli/_build.py",
    "*/riko/cli/_codegen.py",
    "*/riko/cli/_coverage.py",
    "*/riko/cli/_docs.py",
    "*/riko/cli/_docstyle.py",
    "*/riko/cli/_gen_*.py",
    "*/riko/cli/_import_*.py",
    "*/riko/cli/_lint*.py",
    "*/riko/cli/_logging.py",
    "*/riko/cli/_ratchet.py",
    "*/riko/cli/_release.py",
    "*/riko/cli/_shipped_text.py",
    "*/riko/cli/_test.py",
    "*/riko/cli/_upgrade.py",
]

[tool.riko.coverage]
# Ceiling for `manage test --ratchet`: the statements a full-suite run in the full dev
# environment (`--group dev --all-extras`, Python 3.12) leaves unexecuted. A run fails
# above it and lowers it on a gain. It records the day as `uncovered-lowered`.
uncovered = 394
uncovered-lowered = 2026-10-29

[tool.riko.typing]
# Ceilings for `manage lint --escapes`: the package's `typing.Any` references and
# `typing.cast` calls. A run fails above either and lowers it on a gain. It records the
# day as `<key>-lowered`.
any = 128
any-lowered = 2026-10-27
cast = 91
cast-lowered = 2026-10-27

[tool.riko.ratchet]
# Days a ceiling above may hold without being lowered before its ratchet warns.
stale-days = 7

[tool.pylint.format]
max-line-length=88

[tool.pylint.messages_control]
disable = [
    # handled by ruff
    "format",
    # external dependencies graph report
    "RP0401",
]

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.13"]
env_list = [
    "py312",
    "py313",
    "py314",
    "py312-optional",
    "py313-optional",
    "py314-optional",
    "lint",
]

[tool.tox.env_run_base]
description = "run the test suite ({env_name})"
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
set_env = {PYTHONHASHSEED = "94967295", PYTHONWARNINGS = "all"}
commands = [["python", "-m", "riko.cli.manage", "test", "--no-cov", "--quiet"]]

[tool.tox.env.py312-optional]
description = "run test suite, linter, and format checks ({env_name})"
extras = ["perf", "async", "finance"]
dependency_groups = ["test", "lint"]
commands = [
    ["python", "-m", "riko.cli.manage", "test", "--no-cov", "--quiet"],
    ["python", "-m", "riko.cli.manage", "lint", "--check-types"],
    ["python", "-m", "riko.cli.manage", "lint", "--verify-types"],
]

[tool.tox.env.py313-optional]
description = "run test suite, linter, and format checks ({env_name})"
extras = ["perf", "async", "finance"]
dependency_groups = ["test", "lint"]
commands = [
    ["python", "-m", "riko.cli.manage", "test", "--no-cov", "--quiet"],
    ["python", "-m", "riko.cli.manage", "lint", "--check-types"],
    ["python", "-m", "riko.cli.manage", "lint", "--verify-types"],
]

[tool.tox.env.py314-optional]
description = "run test suite, linter, and format checks ({env_name})"
extras = ["perf", "async", "finance"]
dependency_groups = ["test", "lint"]
commands = [
    ["python", "-m", "riko.cli.manage", "test", "--no-cov", "--quiet"],
    ["python", "-m", "riko.cli.manage", "lint", "--check-types"],
    ["python", "-m", "riko.cli.manage", "lint", "--verify-types"],
]

[tool.tox.env.lint]
description = "run linter"
runner = "uv-venv-lock-runner"
dependency_groups = ["lint"]
commands = [
    ["python", "-m", "riko.cli.manage", "lint", "--all"],
    ["python", "-m", "riko.cli.manage", "lint", "imports", "--all"],
]

[tool.uv.build-backend]
module-name = "riko"
module-root = ""

[tool.uv.sources]
meza = { git = "https://github.com/reubano/meza.git", rev = "aa584e56edcd20e038b58379ab833e796dcf92df" }

[build-system]
requires = ["uv_build>=0.11.3,<0.13.0"]
build-backend = "uv_build"
