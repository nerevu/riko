[project]
version = "0.77.1"
name = "riko"
authors = [
    {name = "Reuben Cummings", email = "reubano@gmail.com"}
]
maintainers = [
    {name = "Reuben Cummings", email = "reubano@gmail.com"}
]
description = "A stream processing engine modeled after Yahoo! Pipes."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE*"]
classifiers=[
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.12"
dependencies = [
    "babel>=2.8.0,<3.0.0",
    "chardet>=3.0.4,<8.0.0",
    "click>=8.4.0",
    "feedparser>=5.2.1,<7.0.0",
    "html5lib>=1.0.1,<2.0.0",
    "jinja2>=3.1.6",
    "meza>=0.42.5",
    "mezmorize>=0.27.0",
    "networkx>=3.4.2",
    "pygogo>=0.12.0,<2.0.0",
    "python-dateutil>=2.8.1,<3.0.0",
    "pytz>=2019.3",
    "requests>=2.22.0,<3.0.0",
]

[project.optional-dependencies]
perf = [
    "fastfeedparser>=0.6.0",
    "ijson>=3.4.0,<4.0.0",
    "lxml>=4.5.0,<7.0.0",
    "types-lxml>=2026.2.16",
]

async = [
    "anyio>=4.0.0",
    "httpx>=0.27.0",
]

finance = [
    "csv2ofx>=0.34.2",
]

[dependency-groups]
test = [
    "coverage>=4.3.4,<8.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "sybil>=6,<10",
]

lint = [
    "docutils>=0.21",
    "pygments>=2.20.0",
    "pylint>=4.0.5,<5.0.0",
    "pyright>=1.1.411",
    "ruff>=0.16.5,<0.17.0",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "ipython>=8.39.0",
    "pre-commit>=4.6.1",
    "twine>=6.0.0",
]

[project.scripts]
manage = "riko.cli.manage:manager"
run-pipe = "riko.cli.runpipe:run"
benchmark = "riko.cli.benchmark:main"
compile-pipe = "riko.cli.compile:run"
convert-dag = "riko.cli.convert_dag:run"
gen-config = "riko.cli.gen_config:main"
gen-names = "riko.cli.gen_names:main"
gen-pipelines = "riko.cli.gen_pipelines:main"

[tool.uv]
# Rebuild the local `riko` install when any source file changes, not just when
# pyproject.toml/setup.py change (uv's default). Without this, edits under
# `riko/` (e.g. new CLI options) don't invalidate the cached build, so
# `uv sync`/tox/CI keep reusing a stale wheel of the unchanged version.
cache-keys = [{ file = "pyproject.toml" }, { file = "riko/**/*.py" }]

[tool.ruff]
extend-exclude = [
    "**/pycache",
    ".cache",
    ".claude",
    ".ruff_cache",
    ".tox/*",
    "tmp",
    "build/*",
    "dist/*",
]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
# E704 is default-ignored by ruff (formatter conflict) but suppressed for an
# external flake8 run on overload one-liners; declare it so RUF102 doesn't flag
# the `# noqa: E704` comments as invalid rule codes.
external = ["E704"]
extend-select = [
    "E",    # pycodestyle errors
    "E302", # pycodestyle: Two blank lines before top-level defs
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "I",    # isort
    "B",    # flake8-bugbear: opinionated warnings
    "Q",    # flake8-quotes: enforce consistent quote style)
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "D",    # pydocstyle
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "PLC0415", # Import not at top of file
]

ignore = [
    # temp
    "D400",  # missing-trailing-period
    "D415",  # missing-terminal-punctuation
    "D205",  # missing-blank-line-after-summary
    "D200",  # unnecessary-multiline-docstring

    # docs
    "D100",  # Missing docstring in public module
    "D101",  # undocumented-public-class
    "D102",  # undocumented-public-method
    "D103",  # undocumented-public-function
    "D105",  # undocumented-magic-method
    "D107",  # undocumented-public-init
    "D401",  # non-imperative-mood
    "D417",  # undocumented-param
    "D104",  #undocumented-public-package

    # misc
    "T201",  # print
    "T203",  # p-print

    # stylistic
    "E731",  # do not assign a lambda expression, use a def
    "E501",  # line too long
    "D301",  #escape-sequence-in-docstring

    # security
    "S404",
    "S602",
    "S603",

     # this is incompatible with D211 no-blank-line-before-class
    "D203",  # incorrect-blank-line-before-class

     # this is incompatible with D213 multi-line-summary-second-line
    "D212",  # multi-line-summary-first-line

     # this is incompatible with flake8 E302 Expected 2 blank lines...
    "RUF100",  # unused noqa directive
]

preview = true

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.isort]
known-first-party = ["riko"]
split-on-trailing-comma = false

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = [
    "S101",   # Use of `assert` detected
    "S102",   # Use of `exec` detected
]

"tests/pypipelines/*" = [
    "N999",  # Invalid module name
    "N802",  # Function name
    "N806",  # Variable in function should be lowercase (generated _OUTPUT)
    "UP009",  # UTF-8 encoding declaration (generated header)
]

"examples/pypipelines/*" = [
    "N999",  # Invalid module name
    "N802",  # Function name
    "N806",  # Variable in function should be lowercase (generated _OUTPUT)
    "UP009",  # UTF-8 encoding declaration (generated header)
]

[tool.pyright]
exclude = [
    "**/pycache",
    ".cache",
    ".claude",
    ".ruff_cache",
    ".tox/*",
    "tmp",
    "build/*",
    "dist/*",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "--doctest-glob=*.rst", "--cov=riko", "--tb=short"]
testpaths = ["tests", "riko", "examples", "README.rst", "docs", "_docs/API_SURFACE.md"]
doctest_optionflags = ["ELLIPSIS"]
timeout = 300
markers = [
    "anyio: requires the async optional dependencies (anyio + httpx)",
    "smoke: fast install-validation subset run against the built wheel/sdist",
    "perf: requires the perf extra (lxml/ijson/fastfeedparser); auto-skips if missing",
    "finance: requires the finance extra (csv2ofx); auto-skips if missing",
    "slow: slow test (thread/process pools, parallelism); exclude with -m 'not slow'",
    "simulated_network: exercises HTTP against a loopback server (no real internet)",
]
filterwarnings = [
    # hard-fail on real bugs
    "error::ResourceWarning",
    "error::RuntimeWarning",
    "error::DeprecationWarning:riko",
    "error::PendingDeprecationWarning:riko",
    "error::pytest.PytestUnraisableExceptionWarning",

    # everything else stays visible but non-fatal
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
]

[tool.pylint.format]
max-line-length=88

[tool.pylint.messages_control]
disable = [
    # handled by black/ruff
    "C0330",           # bad-continuation
    "C0326",           # bad-whitespace
    "format",
    "bad-continuation",
    "bad-whitespace",
    # external dependencies graph report
    "RP0401",
]

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.13"]
env_list = [
    "py312",
    "py313",
    "py314",
    "py312-optional",
    "py313-optional",
    "py314-optional",
    "lint",
]

[tool.tox.env_run_base]
description = "run the test suite ({env_name})"
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
set_env = {PYTHONHASHSEED = "94967295", PYTHONWARNINGS = "all"}
commands = [["python", "-m", "riko.cli.manage", "test", "--no-cov", "--quiet"]]

[tool.tox.env.py312-optional]
description = "run test suite, linter, and format checks ({env_name})"
extras = ["perf", "async", "finance"]
dependency_groups = ["test", "lint"]
commands = [
    ["python", "-m", "riko.cli.manage", "test", "--no-cov", "--quiet"],
    ["python", "-m", "riko.cli.manage", "lint", "--check-types"],
    ["python", "-m", "riko.cli.manage", "lint", "--verify-types"],
]

[tool.tox.env.py313-optional]
description = "run test suite, linter, and format checks ({env_name})"
extras = ["perf", "async", "finance"]
dependency_groups = ["test", "lint"]
commands = [
    ["python", "-m", "riko.cli.manage", "test", "--no-cov", "--quiet"],
    ["python", "-m", "riko.cli.manage", "lint", "--check-types"],
    ["python", "-m", "riko.cli.manage", "lint", "--verify-types"],
]

[tool.tox.env.py314-optional]
description = "run test suite, linter, and format checks ({env_name})"
extras = ["perf", "async", "finance"]
dependency_groups = ["test", "lint"]
commands = [
    ["python", "-m", "riko.cli.manage", "test", "--no-cov", "--quiet"],
    ["python", "-m", "riko.cli.manage", "lint", "--check-types"],
    ["python", "-m", "riko.cli.manage", "lint", "--verify-types"],
]

[tool.tox.env.lint]
description = "run linter"
runner = "uv-venv-lock-runner"
dependency_groups = ["lint"]
commands = [
    ["python", "-m", "riko.cli.manage", "lint"],
    ["python", "-m", "riko.cli.manage", "lint", "--rst"],
]

[tool.uv.build-backend]
module-name = "riko"
module-root = ""

[tool.uv.sources]
meza = { git = "https://github.com/reubano/meza.git", rev = "aa584e56edcd20e038b58379ab833e796dcf92df" }

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
