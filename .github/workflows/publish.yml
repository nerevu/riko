name: Publish to PyPI
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
env:
  PYTHONHASHSEED: "94967295"
jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Smoke test (wheel)
        run: |
          tmp="$(mktemp -d)"
          cp -r tests "$tmp/tests"
          cd "$tmp"
          uv run --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.whl \
            --with pytest \
            --with pytest-timeout \
            pytest -p no:cacheprovider -o addopts="" -m smoke \
            tests/public/test_imports.py tests/public/test_collections.py
      - name: Smoke test (source distribution)
        run: |
          tmp="$(mktemp -d)"
          cp -r tests "$tmp/tests"
          cd "$tmp"
          uv run --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.tar.gz \
            --with pytest \
            --with pytest-timeout \
            pytest -p no:cacheprovider -o addopts="" -m smoke \
            tests/public/test_imports.py tests/public/test_collections.py
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
  pypi-publish:
    name: Upload release to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/riko
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
