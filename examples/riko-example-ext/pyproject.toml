[project]
name = "riko-example-ext"
version = "0.1.0"
description = "Example riko extension added via entry points"
requires-python = ">=3.12"
dependencies = ["riko"]

# This is the whole integration contract: declare each module under the
# ``riko.modules`` group by mappings its canonical name to the implementing module
# (or a ModuleDefinition / zero-arg factory returning one, for finer control).
# riko's ModuleRegistry discovers these lazily. The extension is only imported after
# resolving its name.
[project.entry-points."riko.modules"]
"example.shout" = "riko_example_ext"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["riko_example_ext.py"]
