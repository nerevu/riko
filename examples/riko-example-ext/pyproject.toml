[project]
name = "riko-example-ext"
version = "0.1.0"
description = "Example riko extension: adds modules via entry points, with no edit to riko core."
requires-python = ">=3.12"
dependencies = ["riko"]

# This is the whole integration contract: declare each module under the
# ``riko.modules`` group, mapping its canonical name to a ModuleDefinition
# (or a zero-arg factory returning one). riko's ModuleRegistry discovers these
# lazily — the extension is imported only when one of its names is resolved.
[project.entry-points."riko.modules"]
"example.shout" = "riko_example_ext:shout_definition"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["riko_example_ext.py"]
